name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - id: action
        uses: .
        with:
          version-file: 'tests/fixtures/version-file-project/.golangci-lint-version'
          install-mode: 'binary'
          install-only: 'true'
          skip-cache: 'true'
          working-directory: 'tests/fixtures/version-file-project'

      - name: Assert golangci-lint was installed from version-file
        run: |
          echo "Checking golangci-lint is installed..."
          if ! command -v golangci-lint &>/dev/null; then
            echo "FAIL: golangci-lint not found on PATH"
            exit 1
          fi
          VERSION=$(golangci-lint --version 2>&1 || true)
          echo "golangci-lint version: $VERSION"
          if echo "$VERSION" | grep -q "1.64"; then
            echo "PASS: golangci-lint installed with version from version-file (1.64.x)"
          else
            echo "FAIL: expected version 1.64.x but got: $VERSION"
            exit 1
          fi
