name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21'
          cache: false

      - name: Run golangci-lint using version-file input
        id: lint
        uses: .
        with:
          version-file: 'tests/fixtures/simple-go-version-file/.golangci-lint-version'
          working-directory: tests/fixtures/simple-go-version-file
          skip-cache: 'true'
          args: '--timeout=60s'

      - name: Assert lint completed successfully with version from file
        run: |
          echo "golangci-lint action completed successfully using version-file"
          echo "PASS"
