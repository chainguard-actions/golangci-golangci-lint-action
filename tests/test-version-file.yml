name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - name: Create .golangci-lint-version file
        run: |
          echo "v2.3.0" > .golangci-lint-version
          echo "Created .golangci-lint-version with content: $(cat .golangci-lint-version)"

      - id: action
        name: Run golangci-lint action with version-file input
        uses: .
        with:
          version-file: .golangci-lint-version
          install-only: 'true'
          skip-cache: 'true'

      - name: Assert golangci-lint is installed at the version from version-file
        run: |
          echo "Checking golangci-lint is on PATH..."
          if ! command -v golangci-lint &>/dev/null; then
            echo "FAIL: golangci-lint not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT=$(golangci-lint --version 2>&1)
          echo "golangci-lint version: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "golangci-lint"; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          if ! echo "$VERSION_OUTPUT" | grep -q "2.3"; then
            echo "FAIL: expected version 2.3.x but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: golangci-lint is installed at the correct version from version-file"
