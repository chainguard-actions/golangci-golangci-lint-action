name: Test golangci-lint with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: oldstable

      - id: action
        uses: .
        with:
          version: 'v1.64.8'
          working-directory: sample-go-mod
          args: '--timeout=5m --issues-exit-code=0 ./...'
          skip-cache: 'true'

      - name: Assert lint completed in working directory
        run: |
          echo "golangci-lint action completed in working-directory=sample-go-mod"
          echo "PASS: action ran without error in specified working directory"
