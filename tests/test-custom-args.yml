name: Test golangci-lint with custom args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: oldstable

      - id: action
        uses: .
        with:
          version: 'v1.64.8'
          args: '--timeout=5m --issues-exit-code=0 --enable=gofmt ./sample/...'
          skip-cache: 'true'

      - name: Assert lint completed with custom args
        run: |
          echo "golangci-lint action completed with custom args (--enable=gofmt)"
          echo "PASS: action ran without error with custom linter arguments"
