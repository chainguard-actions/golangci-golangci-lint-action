name: Test skip-cache option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - id: action
        name: Run golangci-lint with skip-cache enabled
        uses: .
        with:
          version: v2.3.0
          working-directory: tests/fixtures/skip-cache-go
          skip-cache: 'true'
          args: '--timeout=120s'

      - name: Assert lint ran with skip-cache
        run: |
          echo "PASS: golangci-lint ran successfully with skip-cache=true"
