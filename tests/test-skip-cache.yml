name: Test skip-cache mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - id: action
        uses: .
        with:
          version: 'latest'
          install-mode: 'binary'
          skip-cache: 'true'
          working-directory: 'tests/fixtures/simple-project'
          args: '--timeout=2m'

      - name: Assert golangci-lint ran successfully with cache disabled
        run: |
          echo "golangci-lint action completed with skip-cache=true"
          echo "PASS"
